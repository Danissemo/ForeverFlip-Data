name: Aggregate scans

# Checks and archives the scans players upload with the ForeverFlip Sync helper (issues "Scan upload:"),
# confirms them against each other and refreshes the shared summaries. The issue text is only read
# by the Python script through the API, never put into a shell command.
on:
  issues:
    types: [opened]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Scan upload:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: data

      - uses: actions/checkout@v7
        with:
          repository: Danissemo/ForeverFlip
          path: tool
          sparse-checkout: sync

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check, archive and confirm scans, update the summaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tool/sync/aggregate.py --data data

      - name: Commit the summaries
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared registry
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update scans and shared summaries"
            git push
          fi
